<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Fall 2026 Study Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0}
/* Layout concept: a dashboard where every class owns one colour. A glowing "today" hero, a semester map with every deadline on a timeline, then class pages with rules, topics and grades.
   Color: ink navy, cool paper, one gradient per class (OS blue, FP violet, CN green, DBI red, SDA amber, AADS cyan, extra pink).
   Type: Bricolage Grotesque (display), Instrument Sans (body), JetBrains Mono (times and numbers). */
:root{
  --disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#EEF1F9; --surface:#FFFFFF; --surface2:#F4F6FC; --ink:#0E1330; --muted:#5B6585; --line:#E0E5F2; --track:#E4E8F4;
  --shadow:0 1px 2px rgba(14,19,48,.06),0 14px 30px -18px rgba(14,19,48,.28);
  --ok:#0B8A5A; --warn:#B45309; --bad:#C2253A; --focus:#2F54E0; --tick:#0E1330; --tick-ink:#FFFFFF; --edge:transparent;
  --k-os:#3B5BDB; --k-fp:#8B3FE8; --k-cn:#0E9F6E; --k-dbi:#E5484D; --k-sda:#D97706; --k-aads:#0891B2; --k-ex:#D6409F; --k-buf:#7C86A8; --k-all:#475069;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070A18; --surface:#0F1530; --surface2:#151C3D; --ink:#EDF0FF; --muted:#9AA3C7; --line:#232B52; --track:#222A50;
    --shadow:0 0 0 rgba(0,0,0,0); --ok:#3DD68C; --warn:#F5A524; --bad:#FF7B88; --focus:#7C9BFF; --tick:#EDF0FF; --tick-ink:#0E1330; --edge:rgba(255,255,255,.22);
    --k-os:#7C9BFF; --k-fp:#B58BFF; --k-cn:#34D399; --k-dbi:#FF7A7F; --k-sda:#FBBF24; --k-aads:#38D6F0; --k-ex:#F472B6; --k-buf:#9AA3C7; --k-all:#B8C0DC; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070A18; --surface:#0F1530; --surface2:#151C3D; --ink:#EDF0FF; --muted:#9AA3C7; --line:#232B52; --track:#222A50;
  --shadow:0 0 0 rgba(0,0,0,0); --ok:#3DD68C; --warn:#F5A524; --bad:#FF7B88; --focus:#7C9BFF; --tick:#EDF0FF; --tick-ink:#0E1330; --edge:rgba(255,255,255,.22);
  --k-os:#7C9BFF; --k-fp:#B58BFF; --k-cn:#34D399; --k-dbi:#FF7A7F; --k-sda:#FBBF24; --k-aads:#38D6F0; --k-ex:#F472B6; --k-buf:#9AA3C7; --k-all:#B8C0DC; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono)}

/* class identity */
.c-OS{--cc:var(--k-os);--g:linear-gradient(135deg,#4338CA,#3B82F6)}
.c-FP{--cc:var(--k-fp);--g:linear-gradient(135deg,#6D28D9,#C026D3)}
.c-CN{--cc:var(--k-cn);--g:linear-gradient(135deg,#047857,#10B981)}
.c-DBI{--cc:var(--k-dbi);--g:linear-gradient(135deg,#BE123C,#F97316)}
.c-SDA{--cc:var(--k-sda);--g:linear-gradient(135deg,#B45309,#F59E0B)}
.c-AADS{--cc:var(--k-aads);--g:linear-gradient(135deg,#0E7490,#22D3EE)}
.c-EX{--cc:var(--k-ex);--g:linear-gradient(135deg,#BE185D,#F472B6)}
.c-BUF{--cc:var(--k-buf);--g:linear-gradient(135deg,#64748B,#94A3B8)}
.c-ALL{--cc:var(--k-all);--g:linear-gradient(135deg,#1E293B,#475569)}
.b{display:inline-flex;align-items:center;justify-content:center;flex:none;height:24px;min-width:44px;padding:0 10px;border-radius:999px;background:var(--g);color:#fff;border:1px solid var(--edge);font:700 12px/1 var(--body);letter-spacing:.05em;text-transform:uppercase}
.tint{background:color-mix(in srgb,var(--cc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 24%,var(--line))}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:11px;background:conic-gradient(from 200deg,#3B82F6,#C026D3,#F97316,#10B981,#3B82F6);display:grid;place-content:center;flex:none}
.logo::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--bg)}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:10px;font:600 14.5px var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
#sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
#sync.saved::before{background:var(--ok)}#sync.saving::before{background:var(--warn)}
section.pane[hidden]{display:none!important}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card>h3,.sec>h3{font-size:19px;font-weight:700;letter-spacing:-.005em}
.card .sub{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.grid{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s12{grid-column:1/-1}.s4{grid-column:span 4}.s8{grid-column:span 8}
@media (max-width:900px){.s7,.s5,.s4,.s8{grid-column:1/-1}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font:600 12.5px var(--body);color:var(--muted);white-space:nowrap}
.pill.hot{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.pill.soon{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.tick{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:2px solid color-mix(in srgb,var(--cc,var(--muted)) 70%,var(--surface));border-radius:50%;background:transparent;cursor:pointer;display:grid;place-content:center;flex:none}
.tick:checked{background:var(--cc,var(--tick));border-color:var(--cc,var(--tick))}
.tick:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sq{border-radius:7px;width:22px;height:22px}
input[type=number],input[type=date],textarea{font:500 15px var(--mono);padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%;min-width:0}
textarea{font:400 15px/1.5 var(--body);resize:vertical}
.ring text{font:700 14px var(--mono);fill:var(--ink)}
.ring .rt2{font:500 11px var(--body);fill:var(--muted)}
.ring{flex:none}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:#0B0F2C;border-radius:24px;padding:26px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-35%;z-index:-1;background:
  radial-gradient(38% 38% at 18% 28%,rgba(59,130,246,.7),transparent 70%),
  radial-gradient(34% 34% at 82% 18%,rgba(217,70,239,.5),transparent 70%),
  radial-gradient(38% 38% at 72% 86%,rgba(16,185,129,.45),transparent 70%),
  radial-gradient(34% 34% at 8% 92%,rgba(249,115,22,.5),transparent 70%);filter:blur(14px)}
.hero .eyebrow{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .date{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .num{font:700 clamp(72px,12vw,120px)/.85 var(--disp);letter-spacing:-.04em}
.hero .dm{font:600 24px/1.15 var(--disp)}
.hero .dm span{display:block;opacity:.75;font-weight:500;font-size:18px}
.glass{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:14px 16px}
.next{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.next .tm{font:600 13px var(--mono);opacity:.85;grid-column:1/-1}
.next .tt{font:600 17px/1.3 var(--body)}
.ring.onhero text{fill:#fff}.ring.onhero .rt2{fill:rgba(255,255,255,.75)}
.ring.onhero{--track:rgba(255,255,255,.22);--cc:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;color:var(--ink)}
.hero .btn{background:#fff;color:#0B0F2C;border-color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .v{font:700 44px/1 var(--disp);letter-spacing:-.03em}
.stat .v small{font:500 15px var(--body);color:var(--muted);letter-spacing:0;margin-left:4px}
.stat .l{color:var(--muted);font-size:13.5px;margin-top:8px}

/* semester map */
.mapw{overflow-x:auto;margin-inline:-6px;padding-inline:6px}
.map{min-width:760px;display:grid;gap:6px}
.lane{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center}
.track{position:relative;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.axis{position:relative;height:20px}
.axis i{position:absolute;top:0;font:600 11px var(--mono);color:var(--muted);font-style:normal;transform:translateX(-2px)}
.trip{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--muted) 22%,transparent) 6px 12px)}
.tline{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.eline{position:absolute;top:0;bottom:0;width:3px;background:var(--bad)}
.wline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--cc);border:2px solid var(--surface);cursor:pointer;padding:0}
.mk.q{border-radius:4px;transform:rotate(45deg)}
.mk.done{background:var(--surface);border-color:var(--cc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:50%;background:var(--ink)}
.legend .sw.q{border-radius:3px;transform:rotate(45deg)}
.legend .sw.h{background:var(--surface);border:2px solid var(--ink)}
.legend .sw.t{width:18px;border-radius:2px;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--muted) 3px 6px)}

/* class tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.tile{position:relative;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--g)}
.tile .hd{display:flex;gap:12px;align-items:center;justify-content:space-between}
.tile h4{font-size:19px;font-weight:700;line-height:1.15}
.tile .cr{color:var(--muted);font-size:13px}
.tile .big{font:700 30px/1 var(--disp);letter-spacing:-.02em}
.tile .big small{font:500 13.5px var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.tile .nx{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.tile .nx b{color:var(--ink);font-weight:600}

/* hours chart */
.cols{display:flex;gap:10px;align-items:flex-end;height:190px;padding-top:10px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.stack{width:100%;max-width:56px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden}
.stack i{display:block;background:var(--cc)}
.col .t{font:600 12px var(--mono);color:var(--ink)}
.col .w{font:500 12px var(--body);color:var(--muted)}
.col.cur .w{color:var(--ink);font-weight:700}

/* deadline list */
.dlrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dlrow:first-child{border-top:0}
.dlrow .ttl{min-width:0;overflow-wrap:anywhere}
.dlrow .ttl b{font-weight:600}
.dlrow .ttl small{display:block;color:var(--muted);font-size:13px}
.dlrow.done .ttl b{text-decoration:line-through;color:var(--muted)}
.dlrow .r{text-align:right;display:grid;gap:4px;justify-items:end}
.dlrow .r .d{font:500 12.5px var(--mono);color:var(--muted)}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px}
.wkh{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px}
.wkh h3{font-size:20px}.wkh span{color:var(--muted);font-size:13.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font:600 14px var(--body);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.cc[aria-pressed="true"]{background:var(--g);color:#fff;border-color:transparent}

/* day */
.nav{display:flex;gap:8px;align-items:stretch;margin-bottom:16px}
.nav .arrow{border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;padding:0 14px;font:600 16px var(--body)}
.strip{display:flex;gap:6px;flex:1;min-width:0}
.dayb{flex:1;min-width:0;display:grid;justify-items:center;padding:8px 2px;border:1px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;line-height:1.15}
.dayb:disabled{opacity:.4;cursor:default}
.dayb .dn{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dayb .dd{font:700 24px var(--disp);letter-spacing:-.02em}
.dayb .dm{font:500 11px var(--body);color:var(--muted);min-height:14px}
.dayb.today{border-color:var(--ink)}
.dayb.trip{border-style:dashed}
.dayb.on{background:var(--ink);border-color:var(--ink)}
.dayb.on .dn,.dayb.on .dd,.dayb.on .dm{color:var(--bg)}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.dayhead h2{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1}
.dayhead p{color:var(--muted)}
.dayg{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.dayg{grid-template-columns:minmax(0,1fr)}}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.blk{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:18px}
.blk .tm{font:600 13px/1.25 var(--mono);color:var(--muted)}
.blk .tm b{display:block;color:var(--ink);font-size:15px}
.blk .tx{display:grid;gap:6px;min-width:0}
.blk .tx .nm{font:600 16px/1.3 var(--body);overflow-wrap:anywhere}
.blk .tx .cn{color:var(--muted);font-size:13px}
.blk.done .nm{text-decoration:line-through;color:var(--muted)}
.blk.free{background:var(--surface2);border:1px dashed var(--line);color:var(--muted)}
.hrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.bar{height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc,var(--ok));border-radius:999px}
.mini{display:grid;gap:8px}
.mini .it{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.mini .it span:last-child{min-width:0;overflow-wrap:anywhere}
.note{padding:12px 14px;border-radius:14px;background:var(--surface2);color:var(--muted);margin-top:10px}

/* week */
.wkg{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.wkd{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.wkd.today{border:2px solid var(--ink)}
.wkd.trip{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--surface2) 10px 20px)}
.wkd .h{display:flex;justify-content:space-between;align-items:baseline}
.wkd .h b{font:700 28px var(--disp);letter-spacing:-.03em}
.wkd .h span{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wi{display:grid;gap:5px;padding:9px;border-radius:12px;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.wi small{font:500 11px var(--mono);color:var(--muted)}
.wi.done{opacity:.55;text-decoration:line-through}
.wi.dueit{font-weight:600}
.scroll{overflow-x:auto;margin-inline:-6px;padding:6px}

/* classes */
.clshead{position:relative;overflow:hidden;border-radius:24px;padding:24px;color:#fff;background:var(--g);display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:center;margin-bottom:16px}
.clshead h2{font-size:clamp(28px,4.5vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.05}
.clshead p{opacity:.9;margin-top:6px}
.clshead .ring{--track:rgba(255,255,255,.28);--cc:#fff}
.clshead .ring text{fill:#fff}.clshead .ring .rt2{fill:rgba(255,255,255,.8)}
.clsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.facts{display:grid;gap:0;margin:0}
.facts div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.facts div:first-child{border-top:0}
.facts dt{color:var(--muted);font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.facts dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 12px;font:600 13.5px var(--body)}
.topics{display:grid;gap:2px}
.topic{display:flex;gap:12px;align-items:center;padding:7px 0}
.topic.done span{color:var(--muted);text-decoration:line-through}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f>span{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

function relPill(x){const n=nDays(x.date),dn=S.done["dl:"+x.id];if(dn)return `<span class="pill">done</span>`;const c=n<0||n===0?"hot":n<=2?"soon":"";return `<span class="pill ${c}">${n<0?"overdue":rel(x.date)}</span>`}

function ring(pct,size,stroke,cls,txt,sub,extra){

  return `<svg class="ring c-${cls} ${extra||""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p)} percent"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--cc)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${sub?h-4:h}" text-anchor="middle" dominant-baseline="central">${txt}</text>${sub?`<text class="rt2" x="${h}" y="${h+14}" text-anchor="middle" dominant-baseline="central">${sub}</text>`:""}</svg>`;

const pad=n=>String(n).padStart(2,"0"),range=(n,f)=>Array.from({length:n},(_,i)=>f(i+1));
const num=k=>{const v=parseFloat(S.g[k]);return isNaN(v)?null:v};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const r1=x=>Math.round(x*10)/10;

/* ---------- grade metrics ---------- */
function metrics(){
  const m={};let tot=0,rem=0;const pps=parseFloat(S.pps)||10;
  for(let i=1;i<=12;i++){const v=num("os:s"+pad(i));if(v!==null)tot+=v;else if(i>=6)rem++}
  m.OS={tot,rem,pps,mx:tot+rem*pps};
  const hw=range(14,i=>num("fp:hw"+pad(i-1))).filter(v=>v!==null);
  m.FP={n:hw.length,ha:mean(hw),ex:num("fp:exam"),mid:num("fp:mid")};
  const q=range(6,i=>num("cn:q"+i)).filter(v=>v!==null),h=range(6,i=>num("cn:h"+i)).filter(v=>v!==null);
  m.CN={qn:q.length,qa:mean(q),hn:h.length,ha:mean(h)};
  m.DBI={acc:["dbi:t0","dbi:t1","dbi:t2","dbi:join"].filter(k=>S.chk[k]).length};
  const qs=range(4,i=>num("sda:q"+i)).filter(v=>v!==null),sm=qs.reduce((a,b)=>a+b,0),t=num("sda:target")||80,left=4-qs.length;
  m.SDA={n:qs.length,sm,t,left,need:left>0?(t*4-sm)/left:null};
  let cnt=0,pend=0;
  for(let i=1;i<=4;i++){const v=num("aads:l"+i);if(v===null)continue;if(S.chk["aads:l"+i])cnt+=v;else pend+=v}
  m.AADS={cnt,pend,wt:num("aads:exam")};
  return m;
}
function tileStatus(c,m){
  switch(c){
    case"OS":return[`${m.OS.tot}<small>of 50 points to unlock the exam</small>`,m.OS.tot/50*100];
    case"FP":return[m.FP.ha==null?"–":`${r1(m.FP.ha*10)}%<small>homework average, ${m.FP.n} graded</small>`,m.FP.ha==null?0:m.FP.ha*10];
    case"CN":return[m.CN.qa==null?"–":`${r1(m.CN.qa)}<small>quiz average, ${m.CN.qn} quizzes</small>`,m.CN.qa];
    case"DBI":return[`${m.DBI.acc}<small>of 4 pull requests accepted</small>`,m.DBI.acc/4*100];
    case"SDA":return[m.SDA.n?`${r1(m.SDA.sm/m.SDA.n)}<small>average, need ${m.SDA.need==null?"–":r1(m.SDA.need)} on the rest</small>`:"–",m.SDA.n?m.SDA.sm/m.SDA.n:0];
    case"AADS":return[`${m.AADS.cnt}<small>of 45 defended lab points</small>`,m.AADS.cnt/45*100];
  }
  return["",0];
}
function nextDL(c){return allDL().filter(x=>x.cls===c&&!S.done["dl:"+x.id]&&x.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1)[0]}

  const dlHtml=nx.map(x=>`<div class="dlrow c-${x.cls}"><input type="checkbox" class="tick" aria-label="Mark ${esc(x.title)} done" data-done="dl:${x.id}"><div class="ttl"><b>${esc(x.title)}</b>${x.a?'<span class="tag">assumed</span>':""}<small>${fmt(x.date,{weekday:"short",day:"numeric",month:"short"})}${x.time?" · "+esc(x.time):""}</small></div><div class="r">${relPill(x)}</div></div>`).join("");
  const weekly=PH.map((w,i)=>w[c]||0),
        hrsTxt=weekly.some(v=>v)?`<div class="cols" style="height:120px">${weekly.map((v,i)=>`<div class="col"><span class="t">${v?r1(v):""}</span><div class="stack" style="height:${v/Math.max.apply(null,weekly.concat([1]))*70}px"><i style="height:100%"></i></div><span class="w">${i<8?"W"+(i+1):"Final"}</span></div>`).join("")}</div>`:"";
  $("p-cls").innerHTML=`
  <div class="filters" role="group" aria-label="Choose a class">${chips}</div>
  <div class="clshead c-${c}"><div><h2>${cm.n}</h2><p>${cm.code}${cm.cr?" · "+cm.cr:""}</p></div>${ts.total?ring(ts.pct,86,8,c,Math.round(ts.pct)+"%",ts.done+"/"+ts.total):""}</div>
  <div class="clsg c-${c}">
    <div class="card"><h3>Key facts</h3><dl class="facts" style="margin-top:8px">${INFO[c].map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>${LINKS[c].length?`<div class="links">${LINKS[c].map(l=>`<a href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} &#8599;</a>`).join("")}</div>`:""}</div>
    ${ts.total?`<div class="card"><h3>Topics and prep</h3><p class="sub">Tick them off as you finish. The ring above follows.</p><div class="topics">${TOPICS[c].map((t,i)=>{const k="tp:"+c+":"+i,d1=!!S.topics[k];return `<label class="topic${d1?" done":""}"><input type="checkbox" class="tick sq" data-tp="${k}" ${d1?"checked":""}><span>${esc(t)}</span></label>`}).join("")}</div></div>`:""}
    ${g?`<div class="card"><h3>Grades</h3><p class="sub">${g.hint}</p><div class="fields">${g.fields.map(f=>`<label class="f"><span>${f.l}</span><input type="number" inputmode="decimal" step="any" id="g-${f.k.replace(":","-")}" data-k="${f.k}">${f.chk?`<span class="chk"><input type="checkbox" data-chk="${f.k}"> ${f.chk}</span>`:""}</label>`).join("")}${g.pps?'<label class="f wide"><span>Max points per sheet (assumed 10)</span><input type="number" inputmode="decimal" step="any" id="pps"></label>':""}</div><div class="sum" id="sumbox"></div></div>`:""}
    ${nx.length?`<div class="card"><h3>Next deadlines</h3><div style="margin-top:8px">${dlHtml}</div></div>`:""}
    ${hrsTxt?`<div class="card"><h3>Planned hours per week</h3><p class="sub">Blocks in the daily plan for this class.</p>${hrsTxt}</div>`:""}
    <div class="card"><h3>Notes</h3><p class="sub">Anything you want to keep for this class.</p><textarea id="note" rows="6" data-note="${c}" placeholder="Questions for the TA, formulas, things to ask in the chat"></textarea></div>
  </div>`;
  syncInputs();renderSum();
}
function syncInputs(){
  document.querySelectorAll("[data-k]").forEach(i=>{const v=S.g[i.dataset.k];i.value=v==null?"":v});
  document.querySelectorAll("[data-chk]").forEach(i=>{i.checked=!!S.chk[i.dataset.chk]});
  const p=$("pps");if(p)p.value=S.pps;
  const n=$("note");if(n)n.value=S.notes[n.dataset.note]||"";
}
function renderSum(){
  const e=$("sumbox");if(!e)return;
  const c=clsSel,m=metrics();let pct=null,L=[];
  if(c==="OS"){const o=m.OS;pct=o.tot/50*100;L=o.tot>=50?[["ok",`<b>${o.tot} points.</b> Exam admission reached.`]]:[[o.mx<50?"bad":"warn",`<b>${o.tot} of 50 needed.</b> ${r1(50-o.tot)} more to go.`],["",`Most you can still reach: ${o.mx}, counting ${o.rem} sheets from 06 on at ${o.pps} each.${o.mx<50?" That is below 50, so ask about extra sheets.":""}`]]}
  if(c==="FP"){const f=m.FP;pct=f.ha==null?null:f.ha*10;L=[["",f.ha==null?"No homework graded yet.":`<b>Homework average ${r1(f.ha*10)}%</b> from ${f.n} graded.`],f.ex==null||f.ha==null?["","Add the exam % to see an estimated final grade."]:["ok",`<b>Estimated final ${r1(0.5*f.ha*10+0.5*f.ex)}%</b>`]]}
  if(c==="CN"){const n=m.CN;L=[["",n.qa==null?"No quiz scores yet.":`<b>Quiz average ${r1(n.qa)}</b> from ${n.qn} quizzes.`],["",n.ha==null?"No homework scores yet.":`<b>HW average ${r1(n.ha)}</b> from ${n.hn} homeworks.`]]}
  if(c==="DBI"){pct=m.DBI.acc/4*100;L=[["",`<b>${m.DBI.acc} of 4</b> accepted.`]]}
  if(c==="SDA"){const s=m.SDA;pct=s.n?s.sm/s.n:null;L=[["",s.n?`<b>Average so far ${r1(s.sm/s.n)}</b> over ${s.n} quizzes.`:"No quizzes yet."]];
    if(s.left>0)L.push(s.need>100?["bad",`Target ${s.t} is out of reach: even 100s give ${r1((s.sm+100*s.left)/4)}.`]:s.need<=0?["ok",`Target ${s.t} is already secured.`]:["warn",`<b>Need ${r1(s.need)} on average</b> in the ${s.left} remaining quizzes to reach ${s.t}.`]);
    else L.push(["ok",`<b>Final grade ${r1(s.sm/4)}</b>`])}
  if(c==="AADS"){const a=m.AADS;pct=a.cnt/45*100;L=[[a.cnt>=45?"ok":"warn",`<b>${a.cnt} defended points</b>, 45 of 80 needed.`],["",a.pend?`${a.pend} more points are entered but wait for a defense.`:"No undefended points entered."],a.wt==null?["","Written test not entered."]:[a.wt>=45?"ok":"bad",`Written test ${a.wt}, ${a.wt>=45?"above":"below"} the 45 minimum.`]]}
  e.innerHTML=(pct==null?"":`<div class="bar c-${c}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`)+L.map(l=>`<p class="${l[0]}">${l[1]}</p>`).join("");
}

/* ---------- wiring ---------- */
const RENDER={home:renderHome,day:renderDay,week:renderWeek,dl:renderDL,cls:renderClasses};
function showTab(t){
  tab=t;
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  TABS.forEach(x=>{$("p-"+x).hidden=x!==t});
  RENDER[t]();
  try{localStorage.setItem(LT,t)}catch(e){}
}
function renderAll(){Object.keys(RENDER).forEach(k=>{if(k!=="cls"||tab==="cls")RENDER[k]()})}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-day],[data-wk],[data-goto],[data-filter],[data-today],[data-cls]");
  if(!t)return;
  if(t.dataset.tab)showTab(t.dataset.tab);
  else if(t.dataset.day){sel=t.dataset.day;RENDER[tab]()}
  else if(t.dataset.wk){sel=clamp(addD(sel,7*Number(t.dataset.wk)));RENDER[tab]()}
  else if(t.dataset.goto){sel=clamp(t.dataset.goto);showTab("day")}
  else if(t.dataset.today){sel=clamp(TODAY);RENDER[tab]()}
  else if(t.dataset.filter){dlFilter=t.dataset.filter;renderDL()}
  else if(t.dataset.cls){clsSel=t.dataset.cls;showTab("cls")}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.k){S.g[t.dataset.k]=t.value;touch();renderSum()}
  else if(t.id==="pps"){S.pps=t.value;touch();renderSum()}
  else if(t.dataset&&t.dataset.note){S.notes[t.dataset.note]=t.value;touch()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.done){S.done[t.dataset.done]=t.checked;touch();RENDER[tab]()}
  else if(t.dataset.tp){S.topics[t.dataset.tp]=t.checked;touch();renderClasses()}
  else if(t.dataset.chk){S.chk[t.dataset.chk]=t.checked;touch();renderSum()}
  else if(t.dataset.date){if(t.value)S.dates[t.dataset.date]=t.value;else delete S.dates[t.dataset.date];touch();renderDL()}
});
let first="home";try{const s=localStorage.getItem(LT);if(s&&TABS.indexOf(s)>=0)first=s}catch(e){}
showTab(first);
setSync("saving");
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
